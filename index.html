<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/styles.css">
    <!--importação das fonts do google-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!--impotação do carrossel-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <title>AluraBook - Exercicios</title>
</head>

<body>
    <header class="cabecalho">
        <h1>Exercícios - MobileFirst</h1>
    </header>
    <main>
        <section class="carrossel">
            <h2 class="carrossel__titulo">Novos Lançamentos</h2>

            <!-- ------------------ Carrossel ----------------------------------------->
            <!-- Slider main container -->
            <div class="swiper">
                <!-- If we need pagination -->
                <div class="swiper-pagination"></div>
                
                <!-- Additional required wrapper -->
                <div class="swiper-wrapper">
                    <!-- Slides -->
                    <div class="swiper-slide"><img src="assets/icon_criminal.png"></div>
                    <div class="swiper-slide"><img src="assets/icon_familia.png"></div>
                    <div class="swiper-slide"><img src="assets/icon_trabalhista.png"></div>
                    ...
                </div>                
            </div>
        </section>
    </main>
    <!--importação do script do carrossel-->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- script do carrossel-->
    <script>
        const swiper = new Swiper('.swiper', {
            spaceBetween: 5, //espaço entre cada slide (imagem)
            slidesPerView: 1, //imagens por visualização
            pagination: {
                el: '.swiper-pagination',
                type: 'bullets', /*bolinhas de paginação*/
            }
        });
    </script>
</body>

</html>
